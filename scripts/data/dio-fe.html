<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Dio Webapp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <!-- This sucks, make it better later, this will be more so test than "full version" although I don't know how to do FE-->

        <nav class="navbar navbar-dark bg-dark gap-5">
            <a class="navbar-brand px-4" href="https://github.com/Treechcer/DIO">
                <img src="logo.png" width="30" height="30" class="d-inline-block align-top" alt="">
                Dio WebApp
            </a>
        </nav>

    <div class="container">
        <div class="card border border-warning rounded" style="width: 100%;">
            <div class="card-body">
                <div class="row align-items-center g-3">
                    <div class="col-8">
                        <div class="input-group m-3 input-group-text gap-5">
                            <div class="form-check m-0">
                                <input id="debug" type="checkbox">
                                <label class="form-check-label" for="debug">Debug</label>
                            </div>
                            <div class="form-check m-0">
                                <input id="AppInfo" type="checkbox">
                                <label class="form-check-label" for="AppInfo">App info</label>
                            </div>
                            <div class="form-check m-0">
                                <input id="version" type="checkbox">
                                <label class="form-check-label" for="version">Version</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-4 d-flex justify-content-center position-relative py-2">
                            <button type="button" class="btn btn-primary position-relative px-4" onclick="runDio()">Run</button>
                            <button type="button" class="btn btn-danger position-relative px-4" onclick="clearOutput()">Clear</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-6">
                <div class="card border border-warning rounded">
                    <div class="card-body">
                        <div class="form-group">
                            <label for="inputText">Code input</label>
                            <textarea class="form-control" id="inputText" rows="15"></textarea>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="card border border-warning rounded">
                    <div class="card-body">
                        <div class="form-group">
                            <label for="outputText">Code output</label>
                            <textarea class="form-control" id="outputText" rows="15" readonly></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    
    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Dio Webapp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <!-- This sucks, make it better later, this will be more so test than "full version" although I don't know how to do FE-->
    <div class="container">
        <div class="row">
            <div class="col">
                <div class="card border border-warning rounded" style="width: 100%;">
                    <div class="card-body">
                        <div class="container">
                            <div class="row">
                                <div class="col-4">
                                    <div class="input-group m-3">
                                        <div class="input-group-prepend">
                                            <div class="input-group-text">
                                            <input type="checkbox" aria-label="Checkbox for following text input">
                                            </div>
                                        </div>
                                        <label class="form-check-label" for="checkboxLabel">Debug</label>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="position-relative py-2">
                                        <button type="button" class="btn btn-primary position-relative px-4">Primary</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-5">
                <div class="form-group">
                    <label for="exampleFormControlTextarea1">Code input</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="15"></textarea>
                </div>
            </div>
            <div class="col-2">

            </div>
            <div class="col-5">
                <div class="form-group">
                    <label for="exampleFormControlTextarea1">Code output</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="15" readonly></textarea>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
